# Runs the unit tests on every push and pull request.
#
# Deliberately needs NOTHING but the repository: no secrets, no repository variables, no extra token
# permissions. A failure here is always a defect in the code, so the fix is a code change HealCI can make,
# verify in its sandbox, and hand back at Low or Medium risk.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
