# Posts a build summary as an issue comment.
#
# BROKEN ON PURPOSE (HealCI test case): the workflow declares no `permissions:` block, so GITHUB_TOKEN is
# read-only and the API call comes back 403. The fix is `permissions: issues: write` — which lives in this
# file, and nowhere else.
name: Release notes

on:
  workflow_dispatch:

jobs:
  notes:
    name: Publish release notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Create the notes issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          echo "Creating the release-notes issue…"
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d '{"title":"Release notes","body":"Generated by CI."}')
          echo "HTTP $code"
          cat /tmp/out.json
          if [ "$code" != "201" ]; then
            echo "Error: could not create the issue (HTTP $code)."
            echo "GITHUB_TOKEN has no write access — the workflow grants no permissions."
            exit 1
          fi
